name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCI9p-PYWBK83HeFWgPTje1g
          comment_tag_name: YOUTUBE-CARDS